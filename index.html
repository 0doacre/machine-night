<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simulateur de Réparation - Mission Survie</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Roboto:wght@400;700&display=swap');

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #0f172a;
            color: white;
            overflow: hidden;
            touch-action: none; /* Empêche le zoom et le scroll pour le multitouch */
            user-select: none;
        }

        .title-font { font-family: 'Bangers', cursive; }

        .machine-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 0 auto;
        }

        .progress-ring {
            transform: rotate(-90deg);
        }

        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        .skill-check-zone {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 240px;
            height: 240px;
            border: 8px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            display: none;
            background: rgba(0,0,0,0.6);
            z-index: 40;
        }

        .skill-check-indicator {
            position: absolute;
            width: 14px;
            height: 50px;
            background: #facc15;
            left: calc(50% - 7px);
            transform-origin: 7px 120px;
            border-radius: 6px;
            box-shadow: 0 0 15px rgba(250, 204, 21, 0.8);
        }

        .target-zone {
            position: absolute;
            width: 60px;
            height: 60px;
            background: #22c55e;
            border-radius: 50%;
            left: calc(50% - 30px);
            top: -10px;
            border: 4px solid white;
            box-shadow: 0 0 25px rgba(34, 197, 94, 0.8);
        }

        .tap-prompt {
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translateX(-50%);
            font-weight: 900;
            color: #facc15;
            font-size: 1.5rem;
            animation: pulse-text 0.4s infinite alternate;
        }

        @keyframes pulse-text {
            from { transform: translateX(-50%) scale(1); opacity: 0.8; }
            to { transform: translateX(-50%) scale(1.2); opacity: 1; }
        }

        #repair-btn {
            -webkit-tap-highlight-color: transparent;
        }

        .stunned {
            filter: grayscale(1) opacity(0.5);
            pointer-events: none;
        }

        /* Zone de détection globale pour le QTE */
        #qte-overlay {
            position: fixed;
            inset: 0;
            z-index: 30;
            display: none;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between min-h-screen p-6 bg-slate-950">

    <!-- Overlay invisible pour capter les clics n'importe où pendant le QTE -->
    <div id="qte-overlay"></div>

    <!-- Interface Supérieure -->
    <div class="w-full text-center z-10 pt-4">
        <h1 class="title-font text-5xl text-blue-400 tracking-widest drop-shadow-md">UNITÉ DE RÉPARATION</h1>
        <div class="mt-6 bg-slate-900/90 p-4 rounded-2xl border-2 border-slate-800 shadow-2xl">
            <p class="text-xs uppercase tracking-tighter text-slate-500 font-bold mb-1">Progression Système</p>
            <div class="flex items-center justify-center gap-4">
                <p id="progression-text" class="text-4xl font-black text-green-400 tabular-nums">0.0%</p>
            </div>
        </div>
    </div>

    <!-- Zone Centrale : La Machine -->
    <div class="machine-container" id="machine-wrapper">
        <svg class="progress-ring" width="300" height="300">
            <circle cx="150" cy="150" r="135" stroke="#1e293b" stroke-width="18" fill="transparent" />
            <circle id="progress-bar" cx="150" cy="150" r="135" stroke="#3b82f6" stroke-width="18" fill="transparent" 
                stroke-dasharray="848.23" stroke-dashoffset="848.23" stroke-linecap="round" class="transition-all duration-100" />
        </svg>
        
        <!-- Icône Machine -->
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
            <div id="machine-core" class="bg-slate-900 p-8 rounded-full border-4 border-slate-800 shadow-inner">
                <svg id="machine-icon" xmlns="http://www.w3.org/2000/svg" class="w-24 h-24 text-slate-600 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
            </div>
        </div>

        <!-- Zone Skill Check -->
        <div id="skill-check" class="skill-check-zone">
            <div class="target-zone"></div>
            <div id="skill-indicator" class="skill-check-indicator"></div>
            <div class="tap-prompt">TAPE !</div>
        </div>
    </div>

    <!-- Feedback visuel -->
    <div class="h-12 w-full flex items-center justify-center">
        <div id="status-message" class="text-center font-bold px-4 py-2 rounded-lg opacity-0 transition-all transform scale-90 uppercase tracking-widest">
            SYSTÈME BLOQUÉ !
        </div>
    </div>

    <!-- Contrôles -->
    <div class="w-full max-w-sm pb-10 z-10 px-4">
        <button id="repair-btn" class="w-full py-10 bg-blue-600 active:scale-95 rounded-[2.5rem] shadow-[0_12px_0_rgb(30,58,138)] active:shadow-none active:translate-y-2 transition-all text-3xl font-black uppercase flex items-center justify-center gap-4">
            <span id="btn-icon">🔧</span>
            <span id="btn-text">MAINTENIR</span>
        </button>
        <p class="text-center text-slate-500 text-sm mt-6 font-medium">Maintenez pour réparer • Tapez ailleurs pour les QTE</p>
    </div>

    <!-- Écran de Victoire -->
    <div id="end-modal" class="fixed inset-0 bg-blue-950/95 z-[100] hidden flex items-center justify-center p-8 text-center">
        <div class="max-w-md">
            <div class="mb-6 inline-block p-6 bg-green-500 rounded-full animate-bounce">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
                </svg>
            </div>
            <h2 class="title-font text-7xl mb-4 text-white uppercase">Relancée !</h2>
            <p class="text-2xl text-blue-200 mb-10 leading-relaxed font-bold">FUYEZ ! LE MONSTRE ARRIVE !</p>
            <button onclick="location.reload()" class="w-full bg-white text-blue-950 px-8 py-5 rounded-2xl font-black text-2xl uppercase shadow-xl active:scale-95 transition-transform">Nouvelle Partie</button>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const REPAIR_TIME_SEC = 180; 
        const SKILL_CHECK_CHANCE = 0.007; 
        const SKILL_CHECK_SPEED = 6;     
        const FAIL_PROGRESS_PENALTY = 5; 
        const STUN_DURATION_MS = 3000;   

        // --- ETAT DU JEU ---
        let progress = 0;
        let isRepairing = false;
        let isGameOver = false;
        let isSkillCheckActive = false;
        let isStunned = false;
        let skillAngle = 0;

        // --- DOM ELEMENTS ---
        const repairBtn = document.getElementById('repair-btn');
        const qteOverlay = document.getElementById('qte-overlay');
        const progressBar = document.getElementById('progress-bar');
        const progressionText = document.getElementById('progression-text');
        const machineWrapper = document.getElementById('machine-wrapper');
        const machineIcon = document.getElementById('machine-icon');
        const machineCore = document.getElementById('machine-core');
        const statusMsg = document.getElementById('status-message');
        const skillCheck = document.getElementById('skill-check');
        const skillIndicator = document.getElementById('skill-indicator');
        const endModal = document.getElementById('end-modal');

        // --- LOGIQUE ---

        function triggerShake() {
            machineWrapper.classList.add('shake');
            setTimeout(() => machineWrapper.classList.remove('shake'), 500);
        }

        function showStatus(text, colorClass, duration = 2000) {
            statusMsg.textContent = text;
            statusMsg.className = `text-center font-bold px-4 py-2 rounded-lg transition-all transform scale-100 opacity-100 ${colorClass}`;
            setTimeout(() => {
                statusMsg.classList.add('opacity-0', 'scale-90');
            }, duration);
        }

        function startSkillCheck() {
            if (isSkillCheckActive || isStunned) return;
            isSkillCheckActive = true;
            skillAngle = 0;
            skillCheck.style.display = 'block';
            qteOverlay.style.display = 'block'; // Activer la détection de clic partout
        }

        function failSkillCheck() {
            isSkillCheckActive = false;
            skillCheck.style.display = 'none';
            qteOverlay.style.display = 'none';
            
            progress = Math.max(0, progress - FAIL_PROGRESS_PENALTY);
            triggerShake();
            
            isStunned = true;
            isRepairing = false;
            repairBtn.classList.add('stunned');
            machineCore.classList.add('bg-red-900');
            showStatus("BRUIT DÉTECTÉ ! SYSTÈME BLOQUÉ !", "bg-red-600 text-white", STUN_DURATION_MS);
            
            setTimeout(() => {
                isStunned = false;
                repairBtn.classList.remove('stunned');
                machineCore.classList.remove('bg-red-900');
            }, STUN_DURATION_MS);
        }

        function successSkillCheck() {
            isSkillCheckActive = false;
            skillCheck.style.display = 'none';
            qteOverlay.style.display = 'none';
            progress += 3; 
            showStatus("PARFAIT !", "bg-green-500 text-white", 1000);
        }

        // --- GESTION DU TACTILE ---

        // Démarrer la réparation
        const startRepair = (e) => {
            if (isGameOver || isStunned) return;
            isRepairing = true;
            machineIcon.classList.add('text-blue-400');
            machineIcon.style.animation = 'spin 1.5s linear infinite';
            repairBtn.querySelector('#btn-text').textContent = "RÉPARATION...";
            repairBtn.classList.replace('bg-blue-600', 'bg-blue-400');
        };

        // Arrêter la réparation
        const stopRepair = () => {
            isRepairing = false;
            machineIcon.classList.remove('text-blue-400');
            machineIcon.style.animation = '';
            repairBtn.querySelector('#btn-text').textContent = "MAINTENIR";
            repairBtn.classList.replace('bg-blue-400', 'bg-blue-600');
        };

        // Valider le QTE (N'importe où sur l'écran)
        const checkQTE = (e) => {
            if (!isSkillCheckActive) return;
            
            // Empêche le clic de se propager vers d'autres boutons
            e.preventDefault(); 
            e.stopPropagation();

            // Zone de succès (Haut du cercle)
            if (skillAngle > 335 || skillAngle < 25) {
                successSkillCheck();
            } else {
                failSkillCheck();
            }
        };

        // Listeners Bouton
        repairBtn.addEventListener('mousedown', startRepair);
        repairBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startRepair(); });
        
        // Listeners Relâchement (Global pour plus de souplesse)
        window.addEventListener('mouseup', stopRepair);
        window.addEventListener('touchend', stopRepair);

        // Listener QTE (Global)
        // On écoute sur window ou l'overlay pour capter le deuxième doigt ou le clic ailleurs
        window.addEventListener('mousedown', (e) => { if(isSkillCheckActive) checkQTE(e); });
        window.addEventListener('touchstart', (e) => { if(isSkillCheckActive) checkQTE(e); }, { passive: false });

        // --- BOUCLE DE JEU ---

        function update() {
            if (isGameOver) return;

            if (isRepairing && !isSkillCheckActive && !isStunned) {
                progress += (100 / (REPAIR_TIME_SEC * 60));

                if (Math.random() < SKILL_CHECK_CHANCE) {
                    startSkillCheck();
                }
            }

            if (isSkillCheckActive) {
                skillAngle = (skillAngle + SKILL_CHECK_SPEED) % 360;
                skillIndicator.style.transform = `rotate(${skillAngle}deg)`;
                
                if (skillAngle > 355) {
                    failSkillCheck(); // Temps écoulé
                }
            }

            const circleLength = 848.23; 
            const offset = circleLength - (progress / 100) * circleLength;
            progressBar.style.strokeDashoffset = Math.max(0, offset);
            progressionText.textContent = `${Math.min(100, progress).toFixed(1)}%`;

            if (progress >= 100) {
                isGameOver = true;
                endModal.classList.remove('hidden');
            }

            requestAnimationFrame(update);
        }

        const style = document.createElement("style");
        style.innerText = `@keyframes spin { from {transform:rotate(0deg);} to {transform:rotate(360deg);} }`;
        document.head.appendChild(style);

        requestAnimationFrame(update);
    </script>
</body>

</html>
